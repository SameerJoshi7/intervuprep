name: Keep API Awake

on:
  schedule:
    # GitHub Actions uses UTC time. 
    # This runs every 14 minutes between 03:00 and 15:59 UTC.
    # That perfectly aligns with ~8:30 AM to ~9:30 PM India Standard Time (IST)!
    - cron: '*/14 3-15 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API to wake/keep alive
        run: curl -f https://intervuprep.onrender.com/api/health > /dev/null || echo "Cold start or ping failed"
